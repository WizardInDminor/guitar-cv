site_name: Guitar-to-CV Sequencer
site_description: Bare-metal STM32 capstone — real-time guitar pitch to Eurorack CV/gate
site_author: Matt

theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - System:
    - Charter: system/charter.md
    - Overview: system/overview.md
    - Requirements: system/requirements.md
  - Hardware:
    - Analog Front End: hardware/analog-front-end.md
    - MCP4922 Wiring: hardware/wiring-mcp4922.md
    - Power Design: hardware/power.md
    - Bill of Materials: hardware/bom.md
  - Firmware:
    - Architecture: firmware/architecture.md
    - SPI Driver: firmware/spi-driver.md
    - DAC Output: firmware/dac-output.md
  - Concepts:
    - STM32 Alternate Functions: concepts/stm32-alternate-functions.md
    - SPI Peripheral Deep Dive: concepts/spi-peripheral.md
    - CV Math — 1V/oct: concepts/cv-math.md
  - Decisions:
    - ADR Template: decisions/adr-template.md
    - ADR-001 SPI Peripheral Selection: decisions/adr-001-spi-peripheral.md
    - ADR-002 CS Management: decisions/adr-002-cs-management.md
    - ADR-003 SPI Clock Rate: decisions/adr-003-spi-clock-rate.md
  - Sessions:
    - Session 02 — SPI Bring-Up: sessions/session-02.md
  - Reference:
    - Register Map: reference/register-map.md
    - MCP4922 Command Word: reference/mcp4922-command-word.md
